[pytest]
testpaths = tests
python_files = test_*.py

# Мост pytest -> tdd-guard. Без него страж не видит питоновских прогонов и
# читает test.json, оставшийся от ЧУЖОГО проекта, — то есть судит правки по
# чужому запуску. Корень указан на C:/Projects, потому что там лежит
# .claude/tdd-guard/data/, общий с node-репортёром.
tdd_guard_project_root = C:/Projects
