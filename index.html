<!DOCTYPE html>

<head>

       title «Онлайн-конструктор формы | JetronSport». Но /constructor/ отдаётся без noindex

       «стенд» и «mock» из прежнего заголовка могли уйти в выдачу. Дубль title обёртки не ставим —
       две страницы конкурировали бы в поиске. -->

  {
    "imports": {
      "fabric": "./assets/vendor/fabric.min.mjs"
    }
  }
  </script>

<body>
  <main id="app">
    <section id="stage">
      <div id="views" class="views"></div>

           влево только палитру, а эскизы моделей оставляет прямо под макетом; пока оба блока
           жили в одном #colorpick, по брейкпоинту они не расходились. Раскладку задаёт
           grid-template-areas у #stage. -->

      <div id="modelpick" class="modelpick"></div>
    </section>
    <aside id="panel" class="panel"></aside>
  </main>

  <div id="status" class="status" hidden>Загрузка…</div>
